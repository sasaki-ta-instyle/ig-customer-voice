name: deploy-prod (ConoHa)

# 「本番にあげて」と Claude に指示されたとき、または手動で起動する。
# push やマージでは起動しない（workflow_dispatch のみ）。
# Next.js テンプレの deploy-prod.yml と同じ流れ（releases/<sha> → current 切替 → PM2 → 確認 → 失敗時ロールバック）で、
# ビルドの代わりに依存（@anthropic-ai/sdk）だけ入れてファイルを送る。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (default: main)"
        required: false
        default: "main"

concurrency:
  group: deploy-prod-${{ vars.CATEGORY }}-${{ vars.APP_NAME }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CATEGORY: ${{ vars.CATEGORY }}
      APP_NAME: ${{ vars.APP_NAME }}
      HEALTHCHECK_PATH: ${{ vars.HEALTHCHECK_PATH }}
      DEPLOY_BASE: /var/www/${{ vars.CATEGORY }}/${{ vars.APP_NAME }}
      SHARED_BASE: /var/www/_shared

    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          : "${CATEGORY:?CATEGORY variable is required}"
          : "${APP_NAME:?APP_NAME variable is required}"
          if [[ ! "$CATEGORY" =~ ^(app|cpc|crhr|mb)$ ]]; then
            echo "::error::CATEGORY must be one of app|cpc|crhr|mb (got '$CATEGORY')"; exit 1
          fi
          if [[ ! "$APP_NAME" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::APP_NAME must match /^[a-z][a-z0-9-]*$/ (got '$APP_NAME')"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --prod

      - name: Check syntax
        run: |
          set -euo pipefail
          for f in server.mjs lib/*.mjs public/app.js; do node --check "$f"; done

      - name: Stage files
        run: |
          set -euo pipefail
          mkdir -p _deploy
          cp -r server.mjs prompt.md package.json lib public _deploy/
          cp -RL node_modules _deploy/node_modules

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.CONOHA_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.CONOHA_PORT }} -H ${{ secrets.CONOHA_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload release
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SSH="ssh -p ${{ secrets.CONOHA_PORT }} ${{ secrets.CONOHA_USER }}@${{ secrets.CONOHA_HOST }}"
          $SSH "mkdir -p ${DEPLOY_BASE}/releases/${SHA}"
          rsync -az --delete -e "ssh -p ${{ secrets.CONOHA_PORT }}" _deploy/ \
            ${{ secrets.CONOHA_USER }}@${{ secrets.CONOHA_HOST }}:${DEPLOY_BASE}/releases/${SHA}/
          scp -P ${{ secrets.CONOHA_PORT }} ecosystem.config.cjs \
            ${{ secrets.CONOHA_USER }}@${{ secrets.CONOHA_HOST }}:${DEPLOY_BASE}/releases/${SHA}/ecosystem.config.cjs
          $SSH "
            set -euo pipefail
            REL=${DEPLOY_BASE}/releases/${SHA}
            ln -sfn ${SHARED_BASE}/.env \$REL/.env.base
            ln -sfn ${SHARED_BASE}/apps/${CATEGORY}-${APP_NAME}.env \$REL/.env.app
          "

      - name: Atomic switch + restart
        id: switch
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -p ${{ secrets.CONOHA_PORT }} ${{ secrets.CONOHA_USER }}@${{ secrets.CONOHA_HOST }} "
            set -euo pipefail
            cd ${DEPLOY_BASE}
            if [ -L current ]; then readlink current > .previous_release; fi
            ln -sfn releases/${SHA} current.new
            mv -T current.new current
            cd current
            pm2 delete ${CATEGORY}-${APP_NAME} 2>/dev/null || true
            pm2 start ecosystem.config.cjs --update-env
            pm2 save
          "

      - name: Health check
        run: |
          set -euo pipefail
          URL="https://${CATEGORY}.instyle.group${HEALTHCHECK_PATH}"
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /dev/null --max-time 15 -w "%{http_code}" "$URL" || echo "000")
            if [[ "$CODE" =~ ^2[0-9][0-9]$ ]]; then echo "Health check OK ($URL, HTTP $CODE)"; exit 0; fi
            echo "Attempt $i: HTTP $CODE, retrying in 3s..."; sleep 3
          done
          echo "::error::Health check failed for $URL (last HTTP $CODE)"; exit 1

      - name: Rollback on failure
        if: failure() && steps.switch.outcome == 'success'
        run: |
          set -euo pipefail
          ssh -p ${{ secrets.CONOHA_PORT }} ${{ secrets.CONOHA_USER }}@${{ secrets.CONOHA_HOST }} "
            set -euo pipefail
            cd ${DEPLOY_BASE}
            if [ -f .previous_release ]; then
              PREV=\$(cat .previous_release)
              ln -sfn \$PREV current.new
              mv -T current.new current
              pm2 delete ${CATEGORY}-${APP_NAME} 2>/dev/null || true
              cd current && pm2 start ecosystem.config.cjs --update-env && pm2 save
              echo 'Rolled back to '\$PREV
            else
              echo '::warning::No previous release to roll back to'
            fi
          "

      - name: Cleanup old releases
        if: success()
        run: |
          set -euo pipefail
          ssh -p ${{ secrets.CONOHA_PORT }} ${{ secrets.CONOHA_USER }}@${{ secrets.CONOHA_HOST }} "
            cd ${DEPLOY_BASE}/releases && ls -1t | tail -n +6 | xargs -I{} rm -rf -- {}
          "
